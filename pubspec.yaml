name: bike_companion
description: "Track fuel, service, expenses, and documents for your motorcycle."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Local database
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  google_sign_in: ^6.2.2

  # State management & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0

  # Dependency injection
  get_it: ^8.0.2

  # Fonts
  google_fonts: ^6.2.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.0
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.1.0

  # Media
  image_picker: ^1.1.2
  local_auth: ^2.3.0

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Charts
  fl_chart: ^0.69.0

  # Network images
  cached_network_image: ^3.4.1

  # Sharing / CSV export
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1A56DB"
  adaptive_icon_foreground: "assets/icon/app_icon_fg.png"
  min_sdk_android: 21
  web:
    generate: false

flutter_native_splash:
  color: "#1A56DB"
  color_dark: "#0D2770"
  image: "assets/icon/splash_logo.png"
  image_dark: "assets/icon/splash_logo.png"
  android_12:
    color: "#1A56DB"
    color_dark: "#0D2770"
    image: "assets/icon/splash_logo.png"
  fullscreen: false

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icon/
